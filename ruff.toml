# Ruff config for syncai_backend.
#
# Copied from the SyncAI-Robot-Workspace root when this package was split into
# its own repository, so that a clone of this repo lints the same way it did in
# the workspace. Ruff resolves config by walking up from each file; when this
# repo is vcs-imported back into `<workspace>/src/syncai_backend`, this file
# is the nearest one and therefore wins over the workspace's.
#
# Why the rule set is pinned here rather than inherited from whatever Ruff
# version the editor happens to ship: the 2026 VSCode extension bundles ruff
# 0.16, whose default rule set includes isort, PL*, UP*, TRY*, BLE*, SIM* and
# friends (`ruff check --isolated` enables ~414 rules). Left to defaults that
# turned into hundreds of in-editor warnings overnight, with no code change
# behind them.

# ROS 2 Humble is Python 3.10; syntax-version-dependent rules must not assume
# newer syntax is available.
target-version = "py310"

# Matches the 100 columns the workspace's `.clang-format` pins for C++, so the
# two halves of the stack wrap at the same place. Nothing in the selected rule
# set enforces it today (E501 is not in `E4`/`E7`/`E9`) — it is here so that if
# `ruff format` is ever wired into formatOnSave it does not silently reflow
# everything to Ruff's 88-column default.
line-length = 100

[lint]
# Ruff's historical default: pyflakes plus the pycodestyle subsets that catch
# real errors rather than whitespace. Pinned explicitly so an extension upgrade
# cannot widen it again without someone editing this file.
#
# The wider default set's findings are not all noise — BLE001 (blind excepts),
# RUF013 (implicit Optionals) and UP035 are worth a pass each. But there is no
# CI running Ruff, so widening the select is a deliberate decision to make
# later, one family at a time, not something to inherit by default.
select = ["E4", "E7", "E9", "F"]

# isort (`I`) is deliberately NOT selected. The backend groups its imports by
# architectural layer — main.py walks logger/database/temporal → rest →
# repositories → gateways → subscribers, mirroring the
# routers → gateways → repositories → database layering that CLAUDE.md
# describes — with blank lines carrying that meaning. isort classifies all of
# them as first-party, collapses the groups into one block and alphabetises it,
# which destroys the only place that ordering is written down. If import
# sorting is ever wanted, it needs `lint.isort.sections` teaching it those
# layers first; until then the "Organize imports" quick fix is a regression,
# not a cleanup.
