# syncai_backend CD (dev).
#
# Every push to `dev` builds the Dockerfile's `runtime` stage -- the image
# docker-compose.yml runs -- and pushes it to GHCR as
#
#   ghcr.io/chungweeeei/syncai-backend:dev            floating, the newest dev
#   ghcr.io/chungweeeei/syncai-backend:<sha>-dev      immutable, to roll back to
#
# The robot pulls `dev`; `<sha>-dev` is how a bad merge is undone on the robot
# without a rebuild there (the base stage alone is ~20 min on aarch64).
#
# No tests here. A push to `dev` is a merged PR, and ci.yml already ran lint,
# the suite and a runtime build on that PR. Running them again would only
# delay the image; what this workflow adds is the arm64 build and the push.
#
# arm64 only, on GitHub's native arm64 runner (free for a public repo). The
# robot is a Jetson; an amd64 image is of no use to it, and building arm64
# under QEMU on an x86 runner would multiply that 20 minutes several times.
#
# The build cache is its own scope, not ci.yml's `syncai-backend`: that one
# holds amd64 layers, which an arm64 build cannot reuse -- sharing the scope
# would only make the two evict each other.
#
# The first push creates the GHCR package private, whatever the repo's
# visibility. Either make it public in the package settings or
# `docker login ghcr.io` on the robot with a token that has read:packages.
name: CD (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Two merges in quick succession: only the newer image matters.
concurrency:
  group: cd-dev
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: runtime image -> ghcr (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/syncai-backend
          tags: |
            type=raw,value=dev
            type=sha,format=short,prefix=,suffix=-dev

      # USER_UID and PIP_INDEX_URL stay at the Dockerfile's defaults: 1000 is
      # the robot's user (and compose's default), and PyPI is reachable from
      # GitHub's runners without a mirror.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=syncai-backend-arm64
          cache-to: type=gha,mode=max,scope=syncai-backend-arm64
